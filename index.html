/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

    min-height: 100vh;

/* ==================================================
   HEADER
================================================== */

header {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #233c31,
            #315344 55%,
            #416553

    color: white;

    padding:
        38px
        20px
        34px;

    border-radius:
        0
        0
        34px
        34px;

    box-shadow:
        0 12px 35px rgba(41,66,56,.20);

    content: "🎺";
    position: absolute;

    right: 22px;
    top: 18px;

    font-size: 65px;

    opacity: .10;

    transform: rotate(12deg);
}

header::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -80px;
    bottom: -100px;

    border-radius: 50%;

    background: rgba(255,255,255,.07);
}

.header-inner {
    max-width: 650px;
    margin: auto;

    position: relative;
    z-index: 2;
}

.header-badge {
    display: inline-flex;

    align-items: center;
    gap: 6px;

    padding: 6px 10px;

    border-radius: 999px;

    background: rgba(255,255,255,.12);

    border: 1px solid rgba(255,255,255,.10);

    font-size: 11px;
    font-weight: 700;

    margin-bottom: 12px;

    backdrop-filter: blur(8px);
}

header h1 {
    margin: 0;

    font-size: 30px;

    letter-spacing: -1px;

    line-height: 1.1;
}

header p {
    margin: 9px 0 0;

    opacity: .76;

    font-size: 14px;

    line-height: 1.55;

    max-width: 440px;
}


/* ==================================================
   MAIN
================================================== */

main {
    max-width: 650px;

    margin: auto;

    padding:
        18px
        15px
        115px;
}


/* ==================================================
   TABS
================================================== */

.tabs {
    display: flex;

    gap: 4px;

    background:
        rgba(255,255,255,.88);

    padding: 6px;

    border-radius: 23px;

    margin-bottom: 22px;

    box-shadow:
        0 7px 25px rgba(41,66,56,.09);

    border:
        1px solid rgba(41,66,56,.05);

    position: sticky;

    top: 9px;

    z-index: 20;

    backdrop-filter:
        blur(14px);
}

.tab {
    flex: 1;

    border: 0;

    background: transparent;

    padding:
        11px
        5px;

    border-radius: 18px;

    cursor: pointer;

    color: #718078;

    font-size: 12px;

    font-weight: 650;

    line-height: 1.35;

    transition:
        all .18s ease;
}

.tab:hover {
    background: #f1f5f2;

    color: #3b5549;
}

.tab:active {
    transform: scale(.95);
}

.tab.active {
    background:
        linear-gradient(
            135deg,
            #dceae0,
            #e8f0e9
        );

    color: #294238;

    font-weight: 800;

    box-shadow:
        inset 0 0 0 1px
        rgba(41,66,56,.05),

        0 2px 7px
        rgba(41,66,56,.05);
}


/* ==================================================
   SECTIONS
================================================== */

.section {
    display: none;

    animation:
        fadeIn .22s ease;
}

.section.active {
    display: block;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

   CARDS
================================================== */

.card,
.question-card,
.search-card {

        rgba(255,255,255,.94);

    border:

    box-shadow:
        0 6px 24px

        blur(8px);

    font-size: 12px;

    line-height: 1.5;
}

================================================== */

    color: #50665b;

    font-size: 13px;

    font-weight: 700;

    margin-top: 10px;
}


/* ==================================================
   INPUTS
================================================== */

    font-size: 15px;

    color: #294238;

    background:

        background .2s ease,

/* ==================================================
   PRIMARY BUTTON
================================================== */

.primary {

    width: 100%;

    border: 0;

    background:

            135deg,
            #294238,

    padding: 15px;

    border-radius: 16px;

    font-weight: 800;

    font-size: 13px;

    from {

/* ==================================================
   PNG CHECK
================================================== */

function getPNGFile(inputId) {

    const input =
        document.getElementById(inputId);

    if (
        !input ||
        !input.files ||
        !input.files.length
    ) {

        return null;

    }


    const file =
        input.files[0];


    if (
        file.type !== "image/png"
    ) {

        alert(
            "Możesz dodać tylko zdjęcie PNG! 🖼️"
        );

        input.value = "";

        return null;

    }


    if (
        file.size > 5 * 1024 * 1024
    ) {

        alert(
            "Zdjęcie może mieć maksymalnie 5 MB! 😭"
        );

        input.value = "";

        return null;

    }


    return file;

}



/* ==================================================
   FILE NAME
================================================== */

function showFileName(
    inputId,
    outputId
) {

    const input =
        document.getElementById(inputId);


    const output =
        document.getElementById(outputId);


    if (
        !input ||
        !output
    ) {

        return;

    }


    const file =
        input.files[0];


    if (!file) {

        output.textContent =
            "Nie wybrano zdjęcia";

        return;

    }


    if (
        file.type !== "image/png"
    ) {

        alert(
            "Dozwolone są tylko pliki PNG! 🖼️"
        );

        input.value = "";

        output.textContent =
            "Nie wybrano zdjęcia";

        return;

    }


    if (
        file.size > 5 * 1024 * 1024
    ) {

        alert(
            "Zdjęcie może mieć maksymalnie 5 MB! 😭"
        );

        input.value = "";

        output.textContent =
            "Nie wybrano zdjęcia";

        return;

    }


    output.textContent =
        "📷 " + file.name;

}



/* ==================================================
   UPLOAD
================================================== */

async function uploadPNG(file) {

    if (!file) {
        return null;
    }


    const extension =
        "png";


    const randomName =
        crypto.randomUUID();


    const filePath =
        Date.now() +
        "-" +
        randomName +
        "." +
        extension;


    const { error } =
        await supabaseClient
        .storage
        .from("post-images")
        .upload(
            filePath,
            file,
            {
                contentType:
                    "image/png",

                upsert:
                    false
            }
        );


    if (error) {

        console.error(
            "Błąd uploadu:",
            error
        );

        alert(
            "Nie udało się przesłać zdjęcia 😭"
        );

        return null;

    }


    const { data } =
        supabaseClient
        .storage
        .from("post-images")
        .getPublicUrl(
            filePath
        );


    return data.publicUrl;

}

async function loadQuestions(

) {

    let query =
        supabaseClient
        .from("questions")
        .select(
            "id, text, likes, created_at, image_url"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (
        searchText.trim()
    ) {

        query =
            query.ilike(
                "text",
                "%" +
                searchText.trim() +
                "%"
            );

    }


    const { data, error } =
        await query;


    if (error) {

        console.error(error);

        document
        .getElementById(
            "questionsList"
        )
        .innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                😭
            </div>

            <p>
                Nie udało się wczytać pytań.
            </p>

        </div>

        `;

        return;

    }


    const list =
        document.getElementById(
            "questionsList"
        );


    list.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <p>

                ${
                    searchText.trim()
                    ?
                    "Nie znaleziono pytań."
                    :
                    "Nie ma jeszcze żadnych pytań!"
                }

            </p>

        </div>

        `;

        return;

    }


    data.forEach(question => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "question-card";


        let imageHTML = "";


        if (
            question.image_url
        ) {

            imageHTML = `

                <img
                    class="post-image"
                    src="${escapeHTML(question.image_url)}"
                    alt="Zdjęcie do pytania"
                    loading="lazy"
                >

            `;

        }


        card.innerHTML = `

            <div
                onclick="openQuestion(${question.id})"
                style="cursor:pointer;"
            >

                <div class="anonymous-badge">
                    💬 Anonimowo
                </div>


                <div class="question-title">

                    ${escapeHTML(
                        question.text
                    )}

                </div>


                ${imageHTML}


                <div class="question-meta">

                    ❤️ ${question.likes || 0}

                </div>

            </div>


            <button
                class="like-button"
                onclick="
                    likeQuestion(
                        event,
                        ${question.id}
                    )
                "
            >

                ❤️ ${question.likes || 0}

            </button>

        `;


        list.appendChild(card);

    });

}

async function likeQuestion(
    event,
    questionId
) {

    event.stopPropagation();


    const key =
        "liked-question-" +
        questionId;


    if (
        localStorage.getItem(key)
    ) {

        alert(
            "Już polubiłeś to pytanie! ❤️"
        );

        return;

    }


    const { data: question } =
        await supabaseClient
        .from("questions")
        .select("likes")
        .eq(
            "id",
            questionId
        )
        .single();


    if (!question) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("questions")
        .update({

            likes:
                (question.likes || 0) + 1

        })
        .eq(
            "id",
            questionId
        );


    if (error) {

        console.error(error);

        return;

    }


    localStorage.setItem(
        key,
        "true"
    );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    loadQuestions(
        searchInput
        ?
        searchInput.value
        :
        ""
    );

}

    document

    if (
        question.image_url

        questionImageHTML = `

            <img

                src="${escapeHTML(question.image_url)}"
                alt="Zdjęcie do pytania"

                💡 Odpowiedzi

            </h3>

    `;

        !answers ||
        answers.length === 0
    ) {

        html += `

            <p class="small">

                Nikt jeszcze nie odpowiedział.
                Bądź pierwszy! 👀

    } else {

        answers.forEach(answer => {

                answerImageHTML = `

                    <img
                        class="post-image"
                        src="${escapeHTML(answer.image_url)}"
                        alt="Zdjęcie w odpowiedzi"
                        loading="lazy"
                    >

                `;

            }


            html += `

                <div class="answer">

                    <div class="anonymous-badge">
                        💬 Anonimowo
                    </div>


                    <p>

                        ${escapeHTML(
                            answer.text
                        )}

                    </p>


                    ${answerImageHTML}


                    <button
                        class="like-button"
                        onclick="
                            likeAnswer(
                                ${question.id},
                                ${answer.id}
                            )
                        "
                    >

                        ❤️ ${answer.likes || 0}

                    </button>

                </div>

            `;

        });

    }


    html += `

            <textarea
                id="answerInput"
                placeholder="Napisz anonimową odpowiedź..."
            ></textarea>        <div class="upload-box">

            <label
                class="upload-label"
                for="answerImage"
            >
                📷 Dodaj zdjęcie PNG
            </label>


            <input
                class="upload-input"
                id="answerImage"
                type="file"
                accept="image/png"
                onchange="
                    showFileName(
                        'answerImage',
                        'answerFileName'
                    )
                "
            >


            <div
                id="answerFileName"
                class="file-name"
            >
                Nie wybrano zdjęcia
            </div>

        </div>


        <button
            class="primary"
            onclick="
                submitAnswer(
                    ${question.id}
                )
            "
        >

            ODPOWIEDZ ANONIMOWO

        </button>


    </div>

`;


document
.getElementById(
    "questionContent"
)
.innerHTML = html;
