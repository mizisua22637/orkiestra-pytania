<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orkiestra Hub 🎺</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --green: #294238;
    --green-light: #dce7df;
    --green-soft: #eef3ef;
    --background: #f3f5f1;
    --text: #294238;
    --muted: #78857e;
    --white: #ffffff;
    --danger: #8a3838;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

header {
    background: var(--green);
    color: white;
    padding: 28px 20px 30px;
    border-radius: 0 0 28px 28px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    opacity: .78;
    font-size: 14px;
}

main {
    max-width: 680px;
    margin: auto;
    padding: 18px 15px 110px;
}

/* =========================
   ZAKŁADKI
========================= */

.tabs {
    display: flex;
    background: white;
    padding: 5px;
    border-radius: 19px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.tab {
    flex: 1;
    border: 0;
    background: transparent;
    padding: 11px 5px;
    border-radius: 15px;
    cursor: pointer;
    color: var(--green);
    font-size: 13px;
    transition: .2s;
}

.tab.active {
    background: var(--green-light);
    font-weight: bold;
}

/* =========================
   SEKCJE
========================= */

.section {
    display: none;
}

.section.active {
    display: block;
}

/* =========================
   KARTY
========================= */

.card,
.question-card {
    background: white;
    padding: 19px;
    border-radius: 21px;
    margin-bottom: 15px;
    box-shadow: 0 4px 16px rgba(0,0,0,.055);
}

.card h2,
.card h3 {
    margin-top: 0;
}

.small {
    color: var(--muted);
    font-size: 13px;
}

.empty {
    text-align: center;
    padding: 45px 20px;
    color: var(--muted);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 8px;
}

/* =========================
   INPUTY
========================= */

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    margin-bottom: 12px;
    border: 2px solid #e1e7e2;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: white;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #a9beb1;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

label {
    font-size: 14px;
    font-weight: bold;
}

/* =========================
   PRZYCISKI
========================= */

.primary {
    width: 100%;
    border: 0;
    background: var(--green);
    color: white;
    padding: 14px;
    border-radius: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.secondary {
    border: 0;
    background: #e5ece7;
    color: var(--green);
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
}

.primary:active,
.secondary:active,
.like-button:active,
.plus:active {
    transform: scale(.97);
}

/* =========================
   WYSZUKIWANIE
========================= */

.search-box {
    background: white;
    padding: 15px;
    border-radius: 19px;
    margin-bottom: 15px;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
}

.search-box input {
    margin: 0;
}

/* =========================
   PYTANIA
========================= */

.question-card {
    cursor: default;
}

.question-title {
    font-size: 17px;
    font-weight: bold;
    line-height: 1.45;
    margin-top: 8px;
}

.question-meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
}

.question-click {
    cursor: pointer;
}

/* =========================
   SERDUSZKA
========================= */

.like-button {
    border: 0;
    background: #f1f4f1;
    padding: 8px 12px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 12px;
    color: var(--text);
}

.like-button.liked {
    background: #ffe4e8;
}

/* =========================
   ODPOWIEDZI
========================= */

.answer {
    background: #f1f4f1;
    padding: 14px;
    border-radius: 15px;
    margin-top: 10px;
}

.answer-image,
.post-image {
    width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 15px;
    margin-top: 12px;
    background: #eef1ee;
}

/* =========================
   ZAŁĄCZNIK
========================= */

.file-label {
    display: block;
    background: #eef3ef;
    padding: 12px;
    border-radius: 13px;
    text-align: center;
    cursor: pointer;
    margin-top: 8px;
    color: var(--green);
    font-weight: bold;
}

.file-label input {
    display: none;
}

.file-name {
    font-size: 12px;
    color: var(--muted);
    margin-top: 7px;
}

/* =========================
   PLUS
========================= */

.plus {
    position: fixed;
    right: 20px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 0;
    background: var(--green);
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,0,0,.2);
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 500px;
    padding: 22px;
    border-radius: 22px;
    max-height: 90vh;
    overflow-y: auto;
}

.close {
    float: right;
    border: 0;
    background: transparent;
    font-size: 25px;
    cursor: pointer;
}

/* =========================
   WYDARZENIA
========================= */

.event-date {
    font-size: 13px;
    color: var(--muted);
}

.event-title {
    font-size: 19px;
    font-weight: bold;
    margin-top: 7px;
}

.event-info {
    margin-top: 10px;
    line-height: 1.5;
}

/* =========================
   STATUS
========================= */

.status {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
}

</style>
</head>

<body>

<header>

<h1>🎺 Orkiestra Hub</h1>

<p>
Wszystko, czego potrzebujemy w jednym miejscu.
</p>

</header>

<main>

<!-- =========================
     ZAKŁADKI
========================= -->

<div class="tabs">

<button class="tab active"
onclick="showTab('events', this)">
📅<br>Wydarzenia
</button>

<button class="tab"
onclick="showTab('ask', this)">
💬<br>Zapytaj
</button>

<button class="tab"
onclick="showTab('answers', this)">
💡<br>Odpowiedzi
</button>

</div>


<!-- =========================
     WYDARZENIA
========================= -->

<section id="events" class="section active">

<div id="eventsList">

<div class="empty">
<div class="empty-icon">📅</div>
<p>Ładowanie wydarzeń...</p>
</div>

</div>

</section>


<!-- =========================
     ZAPYTAJ
========================= -->

<section id="ask" class="section">

<div class="card">

<h2>💬 Zadaj anonimowe pytanie</h2>

<p class="small">
Bez konta. Bez imienia. Bez wstydu.
</p>

<textarea
id="questionInput"
placeholder="O co chcesz zapytać?"
></textarea>

<label class="file-label">
🖼️ Dodaj zdjęcie
<input
id="questionImage"
type="file"
accept="image/png,image/jpeg"
onchange="showFileName('questionImage','questionFileName')"
>
</label>

<div id="questionFileName" class="file-name">
Nie wybrano zdjęcia.
</div>

<button
class="primary"
onclick="submitQuestion()">
ZAPYTAJ ANONIMOWO
</button>

<div id="questionStatus" class="status"></div>

</div>

</section>


<!-- =========================
     ODPOWIEDZI
========================= -->

<section id="answers" class="section">

<div class="search-box">

<input
id="searchInput"
type="search"
placeholder="🔎 Szukaj pytań..."
oninput="searchQuestions()"
>

</div>

<div id="questionsList">

<div class="empty">
<div class="empty-icon">💡</div>
<p>Ładowanie pytań...</p>
</div>

</div>

</section>


<!-- =========================
     STRONA PYTANIA
========================= -->

<section id="questionPage" class="section">

<button
class="secondary"
onclick="backToQuestions()">
← Wróć do pytań
</button>

<div
id="questionContent"
style="margin-top:15px;">
</div>

</section>

</main>


<!-- =========================
     PLUS
========================= -->

<button
id="plusButton"
class="plus"
onclick="openEventModal()">
+
</button>


<!-- =========================
     MODAL WYDARZENIA
========================= -->

<div
id="eventModal"
class="modal">

<div class="modal-box">

<button
class="close"
onclick="closeEventModal()">
×
</button>

<h2>📅 Dodaj wydarzenie</h2>

<label>Nazwa wydarzenia</label>

<input
id="eventName"
placeholder="Koncert, próba, wyjazd..."
>

<label>Data</label>

<input
id="eventDate"
type="date"
>

<label>Godzina</label>

<input
id="eventTime"
type="time"
>

<label>Miejsce</label>

<input
id="eventLocation"
placeholder="Gdzie?"
>

<label>Dodatkowe informacje</label>

<textarea
id="eventDescription"
placeholder="Mundur, co zabrać, godzina zbiórki..."
></textarea>

<label class="file-label">
🖼️ Dodaj zdjęcie
<input
id="eventImage"
type="file"
accept="image/png,image/jpeg"
onchange="showFileName('eventImage','eventFileName')"
>
</label>

<div id="eventFileName" class="file-name">
Nie wybrano zdjęcia.
</div>

<button
class="primary"
onclick="addOrchestraEvent()">
DODAJ WYDARZENIE 🎺
</button>

<div id="eventStatus" class="status"></div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://dlrekntxaplaahdhdvjx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PV6MGYFLs3kwV7Pr5u4uCw_f43IxNfk";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==================================================
   USTAWIENIA
================================================== */

const IMAGE_BUCKET = "post-images";

const MAX_IMAGE_SIZE = 5 * 1024 * 1024;


/* ==================================================
   ZAKŁADKI
================================================== */

function showTab(name, button) {

document
.querySelectorAll(".section")
.forEach(section => {
    section.classList.remove("active");
});

document
.querySelectorAll(".tab")
.forEach(tab => {
    tab.classList.remove("active");
});

document
.getElementById(name)
.classList.add("active");

button.classList.add("active");

document
.getElementById("plusButton")
.style.display =
name === "events"
? "block"
: "none";

}


/* ==================================================
   MODAL
================================================== */

function openEventModal() {

document
.getElementById("eventModal")
.style.display = "flex";

}

function closeEventModal() {

document
.getElementById("eventModal")
.style.display = "none";

}


/* ==================================================
   NAZWA PLIKU
================================================== */

function showFileName(inputId, outputId) {

const input =
document.getElementById(inputId);

const output =
document.getElementById(outputId);

if (!input.files.length) {

output.textContent =
"Nie wybrano zdjęcia.";

return;

}

output.textContent =
input.files[0].name;

}


/* ==================================================
   SPRAWDZANIE ZDJĘCIA
================================================== */

function validateImage(file) {

if (!file) {
    return true;
}

if (
file.type !== "image/png" &&
file.type !== "image/jpeg"
) {

alert(
"Dozwolone są tylko zdjęcia PNG i JPEG! 🖼️"
);

return false;

}

if (file.size > MAX_IMAGE_SIZE) {

alert(
"Zdjęcie jest za duże! Maksymalny rozmiar to 5 MB."
);

return false;

}

return true;

}


/* ==================================================
   UPLOAD ZDJĘCIA
================================================== */

async function uploadImage(file) {

if (!file) {
    return null;
}

if (!validateImage(file)) {
    return null;
}

const extension =
file.type === "image/png"
? "png"
: "jpg";

const fileName =
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;

const filePath =
"posts/" + fileName;

const { error } =
await supabaseClient
.storage
.from(IMAGE_BUCKET)
.upload(
    filePath,
    file,
    {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
    }
);

if (error) {

console.error("Błąd uploadu:", error);

throw error;

}


/*
Pobieramy publiczny URL.
*/

const { data } =
supabaseClient
.storage
.from(IMAGE_BUCKET)
.getPublicUrl(filePath);

return data.publicUrl;

}


/* ==================================================
   DODAWANIE WYDARZENIA
================================================== */

async function addOrchestraEvent() {

const name =
document
.getElementById("eventName")
.value
.trim();

const date =
document
.getElementById("eventDate")
.value;

const time =
document
.getElementById("eventTime")
.value;

const location =
document
.getElementById("eventLocation")
.value
.trim();

const description =
document
.getElementById("eventDescription")
.value
.trim();

const imageInput =
document.getElementById("eventImage");

const image =
imageInput.files[0];

const status =
document.getElementById("eventStatus");


if (!name || !date) {

alert(
"Podaj nazwę wydarzenia i datę!"
);

return;

}

try {

status.textContent =
"Przesyłanie...";

let imageUrl = null;

if (image) {

imageUrl =
await uploadImage(image);

}

const { error } =
await supabaseClient
.from("events")
.insert({

name: name,
date: date,
time: time || null,
location: location || null,
description: description || null,
image_url: imageUrl

});

if (error) {
    throw error;
}

closeEventModal();

document
.getElementById("eventName")
.value = "";

document
.getElementById("eventDate")
.value = "";

document
.getElementById("eventTime")
.value = "";

document
.getElementById("eventLocation")
.value = "";

document
.getElementById("eventDescription")
.value = "";

document
.getElementById("eventImage")
.value = "";

document
.getElementById("eventFileName")
.textContent =
"Nie wybrano zdjęcia.";

status.textContent = "";

await loadEvents();

alert(
"Wydarzenie zostało dodane! 🎺"
);

}

catch (error) {

console.error(error);

status.textContent = "";

alert(
"Nie udało się dodać wydarzenia 😭"
);

}

}


/* ==================================================
   WCZYTYWANIE WYDARZEŃ
================================================== */

async function loadEvents() {

const { data, error } =
await supabaseClient
.from("events")
.select("*")
.order(
"date",
{
    ascending: true
}
);

if (error) {

console.error(error);

document
.getElementById("eventsList")
.innerHTML = `

<div class="empty">
<div class="empty-icon">😭</div>
<p>Nie udało się wczytać wydarzeń.</p>
</div>

`;

return;

}

const list =
document.getElementById(
"eventsList"
);

list.innerHTML = "";

if (!data || data.length === 0) {

list.innerHTML = `

<div class="empty">
<div class="empty-icon">📅</div>
<p>Brak wydarzeń.</p>
</div>

`;

return;

}

data.forEach(event => {

const card =
document.createElement("div");

card.className =
"card";

card.innerHTML = `

<div class="event-date">
📆 ${escapeHTML(event.date)}
${event.time
? " • 🕐 " +
escapeHTML(event.time)
: ""}
</div>

<div class="event-title">
🎵 ${escapeHTML(event.name)}
</div>

${
event.location
?
`
<div class="event-info">
📍 ${escapeHTML(event.location)}
</div>
`
:
""
}

${
event.description
?
`
<p class="event-info">
${escapeHTML(event.description)}
</p>
`
:
""
}

${
event.image_url
?
`
<img
class="post-image"
src="${escapeAttribute(event.image_url)}"
alt="Zdjęcie wydarzenia"
>
`
:
""
}

`;

list.appendChild(card);

});

}


/* ==================================================
   PYTANIE
================================================== */

async function submitQuestion() {

const input =
document.getElementById(
"questionInput"
);

const text =
input.value.trim();

const imageInput =
document.getElementById(
"questionImage"
);

const image =
imageInput.files[0];

const status =
document.getElementById(
"questionStatus"
);

if (!text) {

alert(
"Najpierw napisz pytanie! 💬"
);

return;

}

try {

status.textContent =
"Publikowanie...";

let imageUrl = null;

if (image) {

imageUrl =
await uploadImage(image);

}

const { error } =
await supabaseClient
.from("questions")
.insert({

text: text,
likes: 0,
image_url: imageUrl

});

if (error) {
    throw error;
}

input.value = "";

imageInput.value = "";

document
.getElementById(
"questionFileName"
)
.textContent =
"Nie wybrano zdjęcia.";

status.textContent = "";

await loadQuestions();

showAnswersTab();

alert(
"Twoje pytanie zostało dodane anonimowo! 💚"
);

}

catch (error) {

console.error(
"Błąd dodawania pytania:",
error
);

status.textContent = "";

alert(
"Nie udało się dodać pytania 😭"
);

}

}


/* ==================================================
   PRZEJŚCIE DO ODPOWIEDZI
================================================== */

function showAnswersTab() {

document
.querySelectorAll(".section")
.forEach(section => {
    section.classList.remove("active");
});

document
.getElementById("answers")
.classList.add("active");

document
.querySelectorAll(".tab")
.forEach(tab => {
    tab.classList.remove("active");
});

document
.querySelectorAll(".tab")[2]
.classList.add("active");

document
.getElementById("plusButton")
.style.display = "none";

}


/* ==================================================
   PYTANIA
================================================== */

let allQuestions = [];


async function loadQuestions() {

const { data, error } =
await supabaseClient
.from("questions")
.select("*")
.order(
"created_at",
{
    ascending: false
}
);

if (error) {

console.error(error);

document
.getElementById("questionsList")
.innerHTML = `

<div class="empty">
<div class="empty-icon">😭</div>
<p>Nie udało się wczytać pytań.</p>
</div>

`;

return;

}

allQuestions =
data || [];

renderQuestions(
allQuestions
);

}


/* ==================================================
   RENDEROWANIE PYTAŃ
================================================== */

function renderQuestions(questions) {

const list =
document.getElementById(
"questionsList"
);

list.innerHTML = "";

if (!questions.length) {

list.innerHTML = `

<div class="empty">
<div class="empty-icon">💡</div>
<p>Nie znaleziono żadnych pytań.</p>
</div>

`;

return;

}

questions.forEach(question => {

const card =
document.createElement("div");

card.className =
"question-card";

card.innerHTML = `

<div
class="question-click"
onclick="openQuestion(${question.id})">

<div class="small">
💬 Anonimowo
</div>

<div class="question-title">

${escapeHTML(
question.text
)}

</div>

<div class="question-meta">

❤️ ${question.likes || 0}

</div>

${
question.image_url
?
`
<img
class="post-image"
src="${escapeAttribute(question.image_url)}"
alt="Załączone zdjęcie"
>
`
:
""
}

</div>

<button
class="like-button"
onclick="likeQuestion(event, ${question.id})">

❤️ ${question.likes || 0}

</button>

`;

list.appendChild(card);

});

}


/* ==================================================
   SZUKANIE
================================================== */

function searchQuestions() {

const search =
document
.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();

if (!search) {

renderQuestions(
allQuestions
);

return;

}

const filtered =
allQuestions.filter(
question =>
question.text
.toLowerCase()
.includes(search)
);

renderQuestions(
filtered
);

}


/* ==================================================
   LIKE PYTANIA
================================================== */

async function likeQuestion(
event,
questionId
) {

event.stopPropagation();

const key =
"liked-question-" +
questionId;

if (
localStorage.getItem(key)
) {

alert(
"Już polubiłeś to pytanie! ❤️"
);

return;

}

const { data: question } =
await supabaseClient
.from("questions")
.select("likes")
.eq("id", questionId)
.single();

if (!question) return;

const { error } =
await supabaseClient
.from("questions")
.update({

likes:
(question.likes || 0) + 1

})
.eq(
"id",
questionId
);

if (error) {

console.error(error);

return;

}

localStorage.setItem(
key,
"true"
);

await loadQuestions();

}


/* ==================================================
   OTWIERANIE PYTANIA
================================================== */

async function openQuestion(
questionId
) {

const { data: question,
        error: questionError } =
await supabaseClient
.from("questions")
.select("*")
.eq("id", questionId)
.single();

if (
questionError ||
!question
) {

console.error(questionError);

return;

}

const { data: answers,
        error: answerError } =
await supabaseClient
.from("answers")
.select("*")
.eq(
"question_id",
questionId
)
.order(
"likes",
{
    ascending: false
}
);

if (answerError) {

console.error(answerError);

}

document
.querySelectorAll(".section")
.forEach(section => {
    section.classList.remove("active");
});

document
.getElementById(
"questionPage"
)
.classList.add("active");

document
.querySelectorAll(".tab")
.forEach(tab => {
    tab.classList.remove("active");
});

document
.getElementById("plusButton")
.style.display = "none";


let html = `

<div class="card">

<div class="small">
💬 Anonimowo
</div>

<h2>
${escapeHTML(
question.text
)}
</h2>

${
question.image_url
?
`
<img
class="post-image"
src="${escapeAttribute(question.image_url)}"
alt="Załączone zdjęcie"
>
`
:
""
}

<button
class="like-button"
onclick="
likeQuestionFromPage(
${question.id}
)
">

❤️ ${question.likes || 0}

</button>

<h3 style="margin-top:25px;">
💡 Odpowiedzi
</h3>

`;


if (
!answers ||
answers.length === 0
) {

html += `

<p class="small">

Nikt jeszcze nie odpowiedział.
Bądź pierwszy! 👀

</p>

`;

}

else {

answers.forEach(answer => {

html += `

<div class="answer">

<div class="small">
💬 Anonimowo
</div>

<p>
${escapeHTML(
answer.text
)}
</p>

${
answer.image_url
?
`
<img
class="answer-image"
src="${escapeAttribute(answer.image_url)}"
alt="Załączone zdjęcie"
>
`
:
""
}

<button
class="like-button"
onclick="
likeAnswer(
${question.id},
${answer.id}
)
">

❤️ ${answer.likes || 0}

</button>

</div>

`;

});

}


html += `

<textarea
id="answerInput"
placeholder="Napisz anonimową odpowiedź..."
></textarea>

<label class="file-label">
🖼️ Dodaj zdjęcie
<input
id="answerImage"
type="file"
accept="image/png,image/jpeg"
onchange="
showFileName(
'answerImage',
'answerFileName'
)
"
>
</label>

<div
id="answerFileName"
class="file-name">
Nie wybrano zdjęcia.
</div>

<button
class="primary"
onclick="
submitAnswer(
${question.id}
)
">

ODPOWIEDZ ANONIMOWO

</button>

<div
id="answerStatus"
class="status">
</div>

</div>

`;


document
.getElementById(
"questionContent"
)
.innerHTML = html;

}


/* ==================================================
   LIKE PYTANIA ZE STRONY
================================================== */

async function likeQuestionFromPage(
questionId
) {

const key =
"liked-question-" +
questionId;

if (
localStorage.getItem(key)
) {

return;

}

const { data: question } =
await supabaseClient
.from("questions")
.select("likes")
.eq("id", questionId)
.single();

if (!question) return;

const { error } =
await supabaseClient
.from("questions")
.update({

likes:
(question.likes || 0) + 1

})
.eq(
"id",
questionId
);

if (error) {

console.error(error);

return;

}

localStorage.setItem(
key,
"true"
);

openQuestion(
questionId
);

}


/* ==================================================
   DODAWANIE ODPOWIEDZI
================================================== */

async function submitAnswer(
questionId
) {

const input =
document.getElementById(
"answerInput"
);

const text =
input.value.trim();

const imageInput =
document.getElementById(
"answerImage"
);

const image =
imageInput.files[0];

const status =
document.getElementById(
"answerStatus"
);

if (!text) {

alert(
"Najpierw napisz odpowiedź! 💬"
);

return;

}

try {

status.textContent =
"Publikowanie...";

let imageUrl = null;

if (image) {

imageUrl =
await uploadImage(image);

}

const { error } =
await supabaseClient
.from("answers")
.insert({

question_id:
questionId,

text:
text,

likes: 0,

image_url:
imageUrl

});

if (error) {
    throw error;
}

openQuestion(
questionId
);

}

catch (error) {

console.error(
"Błąd dodawania odpowiedzi:",
error
);

status.textContent = "";

alert(
"Nie udało się dodać odpowiedzi 😭"
);

}

}


/* ==================================================
   LIKE ODPOWIEDZI
================================================== */

async function likeAnswer(

) {

);

if (error) {

}

"true"
);

openQuestion(
questionId
);

}

)

)

document
.querySelectorAll(".tab")

.classList.add("active");

.getElementById("plusButton")
.style.display = "none";

/* ==================================================
   BEZPIECZNY HTML
================================================== */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text || "";

return div.innerHTML;

}


/* ==================================================
   BEZPIECZNY URL
================================================== */

function escapeAttribute(value) {

return String(value || "")
.replace(/&/g, "&amp;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;");

}
