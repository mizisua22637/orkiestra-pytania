const SUPABASE_URL =

const supabaseClient =

/* ==================================================
   TAB SWITCHING
================================================== */

function showTab(name, button) {

    document
    .querySelectorAll(".section")
    .forEach(section => {

        section.classList.remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.classList.remove("active");

    });


    const target =
        document.getElementById(name);


    if (target) {

        target.classList.add("active");

    }


    if (button) {

        button.classList.add("active");

    }


    const plus =
        document.getElementById("plusButton");


    if (plus) {

        plus.style.display =
            name === "events"
            ? "block"
            : "none";

    }


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   MODAL
================================================== */

function openEventModal() {

    document
    .getElementById("eventModal")
    .style.display = "flex";

}


function closeEventModal() {

    document
    .getElementById("eventModal")
    .style.display = "none";

}


/* ==================================================
   PNG FILE VALIDATION
================================================== */

function getPNGFile(inputId) {

    const input =
        document.getElementById(inputId);


    if (
        !input ||
        !input.files ||
        !input.files.length
    ) {

        return null;

    }


    const file =
        input.files[0];


    if (
        file.type !== "image/png"
    ) {

        alert(
            "Możesz dodać tylko zdjęcie PNG! 🖼️"
        );

        input.value = "";

        return null;

    }


    if (
        file.size > 5 * 1024 * 1024
    ) {

        alert(
            "Zdjęcie może mieć maksymalnie 5 MB! 😭"
        );

        input.value = "";

        return null;

    }


    return file;

}


/* ==================================================
   FILE NAME
================================================== */

function showFileName(
    inputId,
    outputId
) {

    const input =
        document.getElementById(inputId);

    const output =
        document.getElementById(outputId);


    if (!input || !output) {
        return;
    }


    const file =
        input.files[0];


    if (!file) {

        output.textContent =
            "Nie wybrano zdjęcia";

        return;

    }


    if (
        file.type !== "image/png"
    ) {

        alert(
            "Dozwolone są tylko pliki PNG! 🖼️"
        );

        input.value = "";

        output.textContent =
            "Nie wybrano zdjęcia";

        return;

    }


    if (
        file.size > 5 * 1024 * 1024
    ) {

        alert(
            "Zdjęcie może mieć maksymalnie 5 MB! 😭"
        );

        input.value = "";

        output.textContent =
            "Nie wybrano zdjęcia";

        return;

    }


    output.textContent =
        "📷 " + file.name;

}


/* ==================================================
   UPLOAD
================================================== */

async function uploadPNG(file) {

    if (!file) {
        return null;
    }


    const filePath =
        Date.now() +
        "-" +
        crypto.randomUUID() +
        ".png";


    const { error } =
        await supabaseClient
        .storage
        .from("post-images")
        .upload(
            filePath,
            file,
            {
                contentType: "image/png",
                upsert: false
            }
        );


    if (error) {

        console.error(
            "Błąd uploadu:",
            error
        );

        alert(
            "Nie udało się przesłać zdjęcia 😭"
        );

        return null;

    }


    const { data } =
        supabaseClient
        .storage
        .from("post-images")
        .getPublicUrl(filePath);


    return data.publicUrl;

}


/* ==================================================
   ADD EVENT
================================================== */

async function addOrchestraEvent() {

    const name =
        document
        .getElementById("eventName")
        .value
        .trim();


    const date =
        document
        .getElementById("eventDate")
        .value;


    const time =
        document
        .getElementById("eventTime")
        .value;


    const location =
        document
        .getElementById("eventLocation")
        .value
        .trim();


    const description =
        document
        .getElementById("eventDescription")
        .value
        .trim();


    if (!name || !date) {

        alert(
            "Podaj nazwę wydarzenia i datę!"
        );

        return;

    }


    const imageInput =
        document.getElementById("eventImage");


    const imageFile =
        getPNGFile("eventImage");


    if (
        imageInput.files.length &&
        !imageFile
    ) {

        return;

    }


    let imageUrl = null;


    if (imageFile) {

        imageUrl =
            await uploadPNG(imageFile);


        if (!imageUrl) {
            return;
        }

    }


    const { error } =
        await supabaseClient
        .from("events")
        .insert({

            name: name,
            date: date,
            time: time || null,
            location: location || null,
            description: description || null,
            image_url: imageUrl

        });


    if (error) {

        console.error(error);

        alert(
            "Nie udało się dodać wydarzenia 😭"
        );

        return;

    }


    closeEventModal();


    document.getElementById("eventName").value = "";
    document.getElementById("eventDate").value = "";
    document.getElementById("eventTime").value = "";
    document.getElementById("eventLocation").value = "";
    document.getElementById("eventDescription").value = "";
    document.getElementById("eventImage").value = "";


    document
    .getElementById("eventFileName")
    .textContent =
        "Nie wybrano zdjęcia";


    await loadEvents();


    alert(
        "Wydarzenie zostało dodane! 🎺"
    );

}


/* ==================================================
   LOAD EVENTS
================================================== */

async function loadEvents() {

    const { data, error } =
        await supabaseClient
        .from("events")
        .select("*")
        .order(
            "date",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        document
        .getElementById("eventsList")
        .innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                😭
            </div>

            <p>
                Nie udało się wczytać wydarzeń.
            </p>

        </div>

        `;

        return;

    }


    const list =
        document.getElementById("eventsList");


    list.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                📅
            </div>

            <p>
                Brak wydarzeń.
            </p>

        </div>

        `;

        return;

    }


    data.forEach(event => {

        const card =
            document.createElement("div");


        card.className = "card";


        let imageHTML = "";


        if (event.image_url) {

            imageHTML = `

                <img
                    class="post-image"
                    src="${escapeHTML(event.image_url)}"
                    alt="Zdjęcie wydarzenia"
                    loading="lazy"
                >

            `;

        }


        card.innerHTML = `

            <div class="small">

                📆 ${escapeHTML(event.date)}

                ${
                    event.time
                    ?
                    " • 🕐 " +
                    escapeHTML(event.time)
                    :
                    ""
                }

            </div>


            <h3>
                🎵 ${escapeHTML(event.name)}
            </h3>


            ${
                event.description
                ?
                `<p>
                    ${escapeHTML(event.description)}
                </p>`
                :
                ""
            }


            ${
                event.location
                ?
                `<div class="small">
                    📍 ${escapeHTML(event.location)}
                </div>`
                :
                ""
            }


            ${imageHTML}

        `;


        list.appendChild(card);

    });

}


/* ==================================================
   SUBMIT QUESTION
================================================== */

async function submitQuestion() {

    const input =
        document.getElementById(
            "questionInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        alert(
            "Najpierw napisz pytanie! 💬"
        );

        return;

    }


    const imageInput =
        document.getElementById(
            "questionImage"
        );


    const imageFile =
        getPNGFile(
            "questionImage"
        );


    if (
        imageInput.files.length &&
        !imageFile
    ) {

        return;

    }


    let imageUrl = null;


    if (imageFile) {

        imageUrl =
            await uploadPNG(imageFile);


        if (!imageUrl) {
            return;
        }

    }


    const { error } =
        await supabaseClient
        .from("questions")
        .insert({

            text: text,
            likes: 0,
            image_url: imageUrl

        });


    if (error) {

        console.error(error);

        alert(
            "Nie udało się dodać pytania 😭"
        );

        return;

    }


    input.value = "";

    imageInput.value = "";


    document
    .getElementById(
        "questionFileName"
    )
    .textContent =
        "Nie wybrano zdjęcia";


    await loadQuestions();

    showAnswersTab();


    alert(
        "Twoje pytanie zostało dodane anonimowo! 💚"
    );

}


/* ==================================================
   SHOW ANSWERS
================================================== */

function showAnswersTab() {

    document
    .querySelectorAll(".section")
    .forEach(section => {

        section.classList.remove("active");

    });


    document
    .getElementById("answers")
    .classList.add("active");


    document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.classList.remove("active");

    });


    document
    .querySelectorAll(".tab")[2]
    .classList.add("active");


    document
    .getElementById("plusButton")
    .style.display = "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

/* ==================================================
   LOAD QUESTIONS
================================================== */

async function loadQuestions(
    searchText = ""
) {

    let query =
        supabaseClient
        .from("questions")
        .select(
            "id, text, likes, created_at, image_url"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (
        searchText.trim()
    ) {

        query =
            query.ilike(
                "text",
                "%" +
                searchText.trim() +
                "%"
            );

    }


    const { data, error } =
        await query;


    if (error) {

        console.error(error);

        document
        .getElementById("questionsList")
        .innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                😭
            </div>

            <p>
                Nie udało się wczytać pytań.
            </p>

        </div>

        `;

        return;

    }


    const list =
        document.getElementById(
            "questionsList"
        );


    list.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🔎
            </div>

            <p>

                ${
                    searchText.trim()
                    ?
                    "Nie znaleziono pytań."
                    :
                    "Nie ma jeszcze żadnych pytań!"
                }

            </p>

        </div>

        `;

        return;

    }


    data.forEach(question => {

        const card =
            document.createElement("div");


        card.className =
            "question-card";


        let imageHTML = "";


        if (question.image_url) {

            imageHTML = `

                <img
                    class="post-image"
                    src="${escapeHTML(question.image_url)}"
                    alt="Zdjęcie do pytania"
                    loading="lazy"
                >

            `;

        }


        card.innerHTML = `

            <div
                onclick="openQuestion(${question.id})"
                style="cursor:pointer;"
            >

                <div class="small">
                    💬 Anonimowo
                </div>


                <div class="question-title">

                    ${escapeHTML(
                        question.text
                    )}

                </div>


                ${imageHTML}


                <div class="question-meta">

                    ❤️ ${question.likes || 0}

                </div>

            </div>


            <button
                class="like-button"
                onclick="
                    likeQuestion(
                        event,
                        ${question.id}
                    )
                "
            >

                ❤️ ${question.likes || 0}

            </button>

        `;


        list.appendChild(card);

    });

}


/* ==================================================
   SEARCH
================================================== */

function searchQuestions() {

    const input =
        document.getElementById(
            "searchInput"
        );


    if (!input) {
        return;
    }


    loadQuestions(
        input.value
    );

}


/* ==================================================
   LIKE QUESTION
================================================== */

async function likeQuestion(
    event,
    questionId
) {

    event.stopPropagation();


    const key =
        "liked-question-" +
        questionId;


    if (
        localStorage.getItem(key)
    ) {

        alert(
            "Już polubiłeś to pytanie! ❤️"
        );

        return;

    }


    const { data: question } =
        await supabaseClient
        .from("questions")
        .select("likes")
        .eq(
            "id",
            questionId
        )
        .single();


    if (!question) {
        return;
    }


    const { error } =
        await supabaseClient
        .from("questions")
        .update({

            likes:
                (question.likes || 0) + 1

        })
        .eq(
            "id",
            questionId
        );


    if (error) {

        console.error(error);

        return;

    }


    localStorage.setItem(
        key,
        "true"
    );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    loadQuestions(
        searchInput
        ?
        searchInput.value
        :
        ""
    );

}


/* ==================================================
   OPEN QUESTION
================================================== */

async function openQuestion(
    questionId
) {

    const { data: question } =
        await supabaseClient
        .from("questions")
        .select(
            "id, text, likes, created_at, image_url"
        )
        .eq(
            "id",
            questionId
        )
        .single();


    if (!question) {
        return;
    }


    const { data: answers } =
        await supabaseClient
        .from("answers")
        .select("*")
        .eq(
            "question_id",
            questionId
        )
        .order(
            "likes",
            {
                ascending: false
            }
        );


    document
    .querySelectorAll(".section")
    .forEach(section => {

        section.classList.remove("active");

    });


    document
    .getElementById(
        "questionPage"
    )
    .classList.add("active");


    let questionImageHTML = "";


    if (
        question.image_url
    ) {

        questionImageHTML = `

            <img
                class="post-image"
                src="${escapeHTML(question.image_url)}"
                alt="Zdjęcie do pytania"
            >

        `;

    }


    let html = `

        <div class="card">

            <div class="small">
                💬 Anonimowo
            </div>


            <h2>

                ${escapeHTML(
                    question.text
                )}

            </h2>


            ${questionImageHTML}


            <button
                class="like-button"
                onclick="
                    likeQuestionFromPage(
                        ${question.id}
                    )
                "
            >

                ❤️ ${question.likes || 0}

            </button>


            <h3 style="margin-top:25px;">
                💡 Odpowiedzi
            </h3>

    `;


    if (
        !answers ||
        answers.length === 0
    ) {

        html += `

            <p class="small">

                Nikt jeszcze nie odpowiedział.
                Bądź pierwszy! 👀

            </p>

        `;

    } else {

        answers.forEach(answer => {

            let answerImageHTML = "";


            if (
                answer.image_url
            ) {

                answerImageHTML = `

                    <img
                        class="post-image"
                        src="${escapeHTML(answer.image_url)}"
                        alt="Zdjęcie w odpowiedzi"
                        loading="lazy"
                    >

                `;

            }


            html += `

                <div class="answer">

                    <div class="small">
                        💬 Anonimowo
                    </div>


                    <p>

                        ${escapeHTML(
                            answer.text
                        )}

                    </p>


                    ${answerImageHTML}


                    <button
                        class="like-button"
                        onclick="
                            likeAnswer(
                                ${question.id},
                                ${answer.id}
                            )
                        "
                    >

                        ❤️ ${answer.likes || 0}

                    </button>

                </div>

            `;

        });

    }


    html += `

            <textarea
                id="answerInput"
                placeholder="Napisz anonimową odpowiedź..."
            ></textarea>        <div class="upload-box">

            <label
                class="upload-label"
                for="answerImage"
            >
                📷 Dodaj zdjęcie PNG
            </label>


            <input
                class="upload-input"
                id="answerImage"
                type="file"
                accept="image/png"
                onchange="
                    showFileName(
                        'answerImage',
                        'answerFileName'
                    )
                "
            >


            <div
                id="answerFileName"
                class="file-name"
            >
                Nie wybrano zdjęcia
            </div>

        </div>


        <button
            class="primary"
            onclick="
                submitAnswer(
                    ${question.id}
                )
            "
        >

            ODPOWIEDZ ANONIMOWO

        </button>


    </div>

`;


document
.getElementById(
    "questionContent"
)
.innerHTML = html;


window.scrollTo({
    top: 0,
    behavior: "smooth"
});

}

/* ==================================================
ESCAPE HTML
================================================== */

function escapeHTML(text) {

const div =
    document.createElement("div");


div.textContent =
    text || "";


return div.innerHTML;

}
